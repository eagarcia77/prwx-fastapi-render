name: Train Storm Trajectory AI

on:
  workflow_dispatch:
    inputs:
      build_dataset:
        description: "Download NOAA/NHC HURDAT2 and rebuild the historical training table"
        required: true
        type: boolean
        default: true
      train_model:
        description: "Train the experimental AI storm trajectory model"
        required: true
        type: boolean
        default: true
      force_training:
        description: "Allow experimental training even if readiness thresholds are not fully met"
        required: true
        type: boolean
        default: true
      retention_days:
        description: "Artifact retention days"
        required: true
        type: choice
        options:
          - "7"
          - "14"
          - "30"
        default: "14"

permissions:
  contents: read
  actions: read

concurrency:
  group: storm-historical-ai-training
  cancel-in-progress: false

jobs:
  build-and-train:
    name: Build HURDAT2 dataset and train AI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Show official-source plan
        run: |
          echo "Primary historical source: NOAA/NHC HURDAT2 Atlantic best track"
          echo "Optional validation/extension sources: NOAA/NCEI IBTrACS, AEWC, NCEP/NCAR Reanalysis, ERA5"
          python - <<'PY'
          from prwx.storm_historical_ingest_v30 import source_catalog
          import json
          print(json.dumps(source_catalog(), indent=2, ensure_ascii=False))
          PY

      - name: Download HURDAT2 and build historical training table
        if: ${{ inputs.build_dataset == true }}
        run: |
          python scripts/38_download_historical_storm_data_v30.py

      - name: Train AI storm trajectory model
        if: ${{ inputs.train_model == true && inputs.force_training == false }}
        run: |
          python scripts/39_train_storm_historical_ai_v30.py --train

      - name: Train AI storm trajectory model with force option
        if: ${{ inputs.train_model == true && inputs.force_training == true }}
        run: |
          python scripts/39_train_storm_historical_ai_v30.py --train --force

      - name: Summarize training artifacts
        run: |
          python scripts/40_summarize_storm_training_artifacts_v31.py

      - name: Prepare artifact bundle
        run: |
          mkdir -p artifact_bundle/data_training artifact_bundle/data_processed artifact_bundle/models artifact_bundle/reports
          cp -f data/training/storm_tracks_atlantic_training.csv artifact_bundle/data_training/ 2>/dev/null || true
          cp -f data/training/raw/hurdat2_atlantic_latest.url.txt artifact_bundle/data_training/ 2>/dev/null || true
          cp -f data/processed/storm_historical_training_v30.json artifact_bundle/data_processed/ 2>/dev/null || true
          cp -f data/processed/storm_historical_sources_v30.json artifact_bundle/data_processed/ 2>/dev/null || true
          cp -f data/processed/storm_pr_trajectory_ai_v30.json artifact_bundle/data_processed/ 2>/dev/null || true
          cp -f models/storm_pr_trajectory_ai_v30.joblib artifact_bundle/models/ 2>/dev/null || true
          cp -f reports/storm_training_artifact_manifest_v31.json artifact_bundle/reports/ 2>/dev/null || true
          find artifact_bundle -type f -maxdepth 3 -print

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prwx-storm-ai-training-v31
          path: artifact_bundle
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: warn
