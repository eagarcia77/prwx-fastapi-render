name: AURORA Caribe Continuous Training

on:
  workflow_dispatch:
    inputs:
      force_training:
        description: "Force experimental AURORA-CARIBE training manifest"
        required: true
        type: boolean
        default: true
      run_storm_history:
        description: "Also rebuild historical storm dataset if scripts are available"
        required: true
        type: boolean
        default: true
      retention_days:
        description: "Artifact retention days"
        required: true
        type: choice
        options:
          - "7"
          - "14"
          - "30"
        default: "14"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: aurora-caribe-continuous-training
  cancel-in-progress: false

jobs:
  train-aurora-caribe:
    name: Train AURORA Caribe-Atlántico
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Operational refresh if available
        run: |
          python scripts/render_bootstrap_v21.py || true
          python scripts/31_operational_update_v20.py --skip-external-checks || true

      - name: Build storm historical dataset if requested
        if: ${{ github.event_name == 'schedule' || inputs.run_storm_history == true }}
        run: |
          python scripts/38_download_historical_storm_data_v30.py || true
          python scripts/39_train_storm_historical_ai_v30.py --build --train --force || true

      - name: Run AURORA Caribe continuous training
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/41_aurora_caribe_continuous_training_v34.py --force
          elif [ "${{ inputs.force_training }}" = "true" ]; then
            python scripts/41_aurora_caribe_continuous_training_v34.py --force
          else
            python scripts/41_aurora_caribe_continuous_training_v34.py
          fi

      - name: Prepare artifact bundle
        run: |
          mkdir -p artifact_bundle/data_processed artifact_bundle/reports artifact_bundle/models
          cp -f data/processed/aurora_caribe_status_v34.json artifact_bundle/data_processed/ 2>/dev/null || true
          cp -f data/processed/aurora_caribe_training_v34.json artifact_bundle/data_processed/ 2>/dev/null || true
          cp -f data/processed/aurora_caribe_predictions_v34.json artifact_bundle/data_processed/ 2>/dev/null || true
          cp -f data/processed/aurora_caribe_continuous_training_v34.json artifact_bundle/data_processed/ 2>/dev/null || true
          cp -f reports/aurora_caribe_training_manifest_v34.json artifact_bundle/reports/ 2>/dev/null || true
          cp -f models/aurora_caribe_ai_v34.joblib artifact_bundle/models/ 2>/dev/null || true
          find artifact_bundle -type f -maxdepth 3 -print

      - name: Upload AURORA Caribe artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-caribe-ai-training-v34
          path: artifact_bundle
          retention-days: ${{ github.event_name == 'schedule' && 7 || inputs.retention_days }}
          if-no-files-found: warn
