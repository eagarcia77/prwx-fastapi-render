<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PR-WX Desktop + Mobile</title>
  <style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f8fafc;color:#0f172a}.hero{min-height:100vh;display:grid;place-items:center;padding:24px}.panel{max-width:920px;background:white;border:1px solid #cbd5e1;border-radius:24px;padding:32px;box-shadow:0 12px 40px rgba(15,23,42,.12)}h1{font-size:clamp(2.2rem,6vw,5rem);margin:.2rem 0}.tag{font-weight:900;color:#0f766e;letter-spacing:.14em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px}.btn{display:block;text-decoration:none;text-align:center;border-radius:16px;padding:18px;background:#0f766e;color:white;font-weight:900}.secondary{background:#134e4a}.light{background:#e2e8f0;color:#0f172a}@media(max-width:720px){.grid{grid-template-columns:1fr}.panel{padding:22px}}</style>
</head>
<body>
  <main class="hero">
    <section class="panel">
      <p class="tag">PR-WX v2.4.1</p>
      <h1>Desktop + Mobile</h1>
      <p>Seleccione la versión que desea abrir. Para operación real use Render, porque ahí corre la API FastAPI.</p>
      <div class="grid">
        <a class="btn" href="https://prwx-fastapi-render.onrender.com/desktop/">Abrir Desktop en Render</a>
        <a class="btn secondary" href="https://prwx-fastapi-render.onrender.com/mobile/">Abrir Mobile en Render</a>
        <a class="btn light" href="./desktop/">Desktop en GitHub Pages</a>
        <a class="btn light" href="./mobile/">Mobile en GitHub Pages</a>
      </div>
    </section>
  </main>
</body>
</html>
